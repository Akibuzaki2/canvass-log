name: overpass-diag
on:
  push:
    branches: [diag]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: loop-routes, path: app }
      - uses: actions/checkout@v4
        with: { path: diag }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd diag && npm i --no-save playwright@1.47.2 && npx playwright install chromium
      - run: cd diag && node live.mjs ../app
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: diag/*.png }
